<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For Oun Ta 💜</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container" id="mainCard">
        <div class="emoji-header">✨💜✨</div>
        <h1>Hi Bebe...</h1>
        <p>I have something special for you.</p>
        <button id="anniversaryBtn" class="main-button">HAPPY 2MONTH ANNIVERSARY BEBE</button>
    </div>

    <div class="letter-paper hidden" id="loveLetter">
        <h2 class="letter-title">My Forever Choice</h2>
        <div id="typewriter" class="letter-content"></div>
        
        <div id="touchHereContainer" class="hidden-fade" style="text-align: center; margin-top: 20px;">
            <button id="touchHereBtn" class="touch-button">TOUCH HERE</button>
        </div>

        <div id="questionArea" class="hidden">
            <table class="q-table">
                <tr>
                    <th id="currentQuestion">Do you love me as I do?</th>
                </tr>
                <tr>
                    <td class="btn-cell">
                        <button id="yesBtn" class="choice-btn yes">YES</button>
                        <button id="noBtn" class="choice-btn no">NO</button>
                    </td>
                </tr>
            </table>
        </div>

        <div id="letterFooter" class="footer-emoji hidden-fade">🕊️ Your constant, Khemra 💜</div>
    </div>

    <script src="script.js"></script>
</body>
</html>
